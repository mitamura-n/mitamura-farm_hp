# DRAFT ONLY: merge into the existing root .htaccess after approval.
# Requires Apache 2.4. Keep existing Xserver PHP settings and the Laravel rules.
# Place this block before generic HTTPS/www redirects and Laravel fallback.
# Do not copy this fragment as the complete .htaccess.

<If "%{HTTP_HOST} =~ /^(www\.)?mitamurafarm\.com$/">
    ErrorDocument 410 /legacy-form-closed.html
    DirectoryIndex index.php
</If>

RewriteEngine On


# Old CGI must never execute or replay a submitted order into the new form.
RewriteCond %{HTTP_HOST} ^(www\.)?mitamurafarm\.com$ [NC]
RewriteRule ^kantan-cgi/formmail\.pl(?:/.*)?$ - [G,END,NC]

# Only GET/HEAD old-page visits may redirect. Reject old-page submissions.
RewriteCond %{REQUEST_METHOD} !^(GET|HEAD)$
RewriteCond %{HTTP_HOST} ^(www\.)?mitamurafarm\.com$ [NC]
RewriteRule ^(?:index|okome2|order|otoiawase)\.htm$ - [G,END,NC]
RewriteCond %{REQUEST_METHOD} !^(GET|HEAD)$
RewriteCond %{HTTP_HOST} ^(www\.)?mitamurafarm\.com$ [NC]
RewriteRule ^(?:komeko/komeko|komenuka/komenuka_Top)\.htm$ - [G,END,NC]

# Discard old query strings rather than copying possible form data into URLs.
RewriteCond %{HTTP_HOST} ^(www\.)?mitamurafarm\.com$ [NC]
RewriteRule ^index\.htm$ https://mitamurafarm.com/ [R=301,END,NE,QSD]
RewriteCond %{HTTP_HOST} ^(www\.)?mitamurafarm\.com$ [NC]
RewriteRule ^okome2\.htm$ https://mitamurafarm.com/#story [R=301,END,NE,QSD]
RewriteCond %{HTTP_HOST} ^(www\.)?mitamurafarm\.com$ [NC]
RewriteRule ^order\.htm$ https://mitamurafarm.com/#guide [R=301,END,NE,QSD]
RewriteCond %{HTTP_HOST} ^(www\.)?mitamurafarm\.com$ [NC]
RewriteRule ^otoiawase\.htm$ https://mitamurafarm.com/#contact [R=301,END,NE,QSD]
RewriteCond %{HTTP_HOST} ^(www\.)?mitamurafarm\.com$ [NC]
RewriteRule ^(?:komeko/komeko|komenuka/komenuka_Top)\.htm$ https://mitamurafarm.com/#products [R=301,END,NE,QSD]

# Keep the 410 error document local even for an HTTP legacy submission.
RewriteCond %{ENV:REDIRECT_STATUS} =410
RewriteCond %{HTTP_HOST} ^(www\.)?mitamurafarm\.com$ [NC]
RewriteRule ^legacy-form-closed\.html$ - [END]

# Canonical host and HTTPS. 308 keeps legitimate non-legacy request methods.
RewriteCond %{HTTPS} !=on [OR]
RewriteCond %{HTTP_HOST} !^mitamurafarm\.com$ [NC]
RewriteCond %{HTTP_HOST} ^(www\.)?mitamurafarm\.com$ [NC]
RewriteRule ^ https://mitamurafarm.com%{REQUEST_URI} [R=308,END,NE]

# DirectoryIndex is scoped to production hosts in the If block above.

# Continue with existing Authorization/XSRF handling and Laravel fallback.
# qa.htm and low.htm are intentionally unresolved; do not guess their targets.
