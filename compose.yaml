name: mitamura-development
services:
  db:
    image: mariadb:10.11
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MARIADB_DATABASE: mitamura_dev
      MARIADB_USER: mitamura
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DEV_DB_ROOT_PASSWORD:?Set DEV_DB_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  db_data:
